services:
  smb:
    # build: .
    image: ghcr.io/flobernd/paperless-smb-sync:latest
    restart: unless-stopped
    ports:
      - "445:445"
    environment:
      PAPERLESS_URL: http://webserver:8000
      PAPERLESS_API_TOKEN: change-me
      # Needs the token of a superuser. It also needs SMB_HOST, since the
      # document shows <server> in place of the server name without it.
      # CREDENTIALS_DOCUMENT: "true"
      # PAPERLESS_CONSUMPTION_DIR: /usr/src/paperless/consume
      # PAPERLESS_GID: "10000"
      # POLL_INTERVAL: "30"
      # SHARE_NAME: inbox
      # SMB_HOST: paperless.example.lan
      # SYNC_GROUP: smb
      # UID_BASE: "20000"
    volumes:
      - /srv/paperless/inbox:/shares/inbox
      # Holds passdb.tdb. Without it each user gets a new password on recreate.
      - samba-data:/var/lib/samba
      # - ./smb-custom.conf:/etc/samba/conf.d/custom.conf:ro

volumes:
  samba-data:
